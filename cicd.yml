name: cicdpipeline

on:
  push:
    branches:
      - main

jobs:
  Unit_testcases:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          pip install ruff

      - name: Run application
        run: python main.py

      - name: Code quality check
        run: ruff check .